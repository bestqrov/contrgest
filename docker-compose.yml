version: '3.9'

x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '10m'
    max-file: '3'

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_EVIDENCE_BUCKET: ${MINIO_EVIDENCE_BUCKET:-fieldops-evidence}
  MINIO_APK_BUCKET: ${MINIO_APK_BUCKET:-fieldops-apk}
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  networks:
    - fieldops-internal

services:
  # ── Infrastructure ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fieldops-postgres
    <<: *service-defaults
    environment:
      POSTGRES_DB: ${DB_NAME:-fieldops_db}
      POSTGRES_USER: ${DB_USER:-fieldops}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-fieldops} -d ${DB_NAME:-fieldops_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    container_name: fieldops-redis
    <<: *service-defaults
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel notice
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '6379:6379'

  # ── MinIO Object Storage ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: fieldops-minio
    <<: *service-defaults
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    container_name: fieldops-createbuckets
    networks:
      - fieldops-internal
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} &&
      /usr/bin/mc mb --ignore-existing local/fieldops-evidence &&
      /usr/bin/mc mb --ignore-existing local/fieldops-apk &&
      /usr/bin/mc anonymous set public local/fieldops-apk &&
      echo 'Buckets ready' && exit 0
      "

  # ── DB Migrations (runs once, exits) ───────────────────────
  db-migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    container_name: fieldops-db-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - fieldops-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # ── API Service ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: fieldops-api
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${API_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-900000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-100}
      EVIDENCE_VAULT_INTERNAL_URL: ${EVIDENCE_VAULT_INTERNAL_URL}
      GPS_ENGINE_INTERNAL_URL: ${GPS_ENGINE_INTERNAL_URL}
      ALERT_ENGINE_INTERNAL_URL: ${ALERT_ENGINE_INTERNAL_URL}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # ── WhatsApp Logger ─────────────────────────────────────────
  whatsapp-logger:
    build:
      context: .
      dockerfile: services/whatsapp-logger/Dockerfile
    container_name: fieldops-whatsapp-logger
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${WHATSAPP_LOGGER_PORT:-4001}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      EVIDENCE_VAULT_INTERNAL_URL: ${EVIDENCE_VAULT_INTERNAL_URL}
      ALERT_ENGINE_INTERNAL_URL: ${ALERT_ENGINE_INTERNAL_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
    ports:
      - '4001:4001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Content Guard ───────────────────────────────────────────
  content-guard:
    build:
      context: .
      dockerfile: services/content-guard/Dockerfile
    container_name: fieldops-content-guard
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${CONTENT_GUARD_PORT:-4002}
      MAX_CONTENT_FILE_SIZE_MB: ${MAX_CONTENT_FILE_SIZE_MB:-500}
      ALLOWED_CONTENT_MIME_TYPES: ${ALLOWED_CONTENT_MIME_TYPES}
      EVIDENCE_VAULT_INTERNAL_URL: ${EVIDENCE_VAULT_INTERNAL_URL}
      ALERT_ENGINE_INTERNAL_URL: ${ALERT_ENGINE_INTERNAL_URL}
      WHATSAPP_OWNER_JID: ${WHATSAPP_OWNER_JID}
    ports:
      - '4002:4002'
    volumes:
      - content_uploads:/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Evidence Vault ──────────────────────────────────────────
  evidence-vault:
    build:
      context: .
      dockerfile: services/evidence-vault/Dockerfile
    container_name: fieldops-evidence-vault
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${EVIDENCE_VAULT_PORT:-4003}
      EVIDENCE_STORAGE_PATH: ${EVIDENCE_STORAGE_PATH:-/data/evidence}
      EVIDENCE_MAX_FILE_SIZE_MB: ${EVIDENCE_MAX_FILE_SIZE_MB:-1024}
      EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:-365}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    ports:
      - '4003:4003'
    volumes:
      - evidence_data:/data/evidence
    depends_on:
      postgres:
        condition: service_healthy

  # ── GPS Engine ──────────────────────────────────────────────
  gps-engine:
    build:
      context: .
      dockerfile: services/gps-engine/Dockerfile
    container_name: fieldops-gps-engine
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${GPS_ENGINE_PORT:-4004}
      GPS_BATCH_INTERVAL_MS: ${GPS_BATCH_INTERVAL_MS:-30000}
      GPS_ANOMALY_SPEED_THRESHOLD_KMH: ${GPS_ANOMALY_SPEED_THRESHOLD_KMH:-150}
      GPS_GEOFENCE_CHECK_INTERVAL_MS: ${GPS_GEOFENCE_CHECK_INTERVAL_MS:-60000}
      ALERT_ENGINE_INTERNAL_URL: ${ALERT_ENGINE_INTERNAL_URL}
    ports:
      - '4004:4004'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── MDM Service ─────────────────────────────────────────────
  mdm-service:
    build:
      context: .
      dockerfile: services/mdm-service/Dockerfile
    container_name: fieldops-mdm-service
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${MDM_SERVICE_PORT:-4005}
      MDM_ENROLLMENT_TOKEN_EXPIRES_HOURS: ${MDM_ENROLLMENT_TOKEN_EXPIRES_HOURS:-48}
      ANDROID_ENTERPRISE_SERVICE_ACCOUNT_JSON: ${ANDROID_ENTERPRISE_SERVICE_ACCOUNT_JSON}
      MDM_POLICY_UPDATE_INTERVAL_MS: ${MDM_POLICY_UPDATE_INTERVAL_MS:-300000}
      ALERT_ENGINE_INTERNAL_URL: ${ALERT_ENGINE_INTERNAL_URL}
    ports:
      - '4005:4005'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Alert Engine ─────────────────────────────────────────────
  alert-engine:
    build:
      context: .
      dockerfile: services/alert-engine/Dockerfile
    container_name: fieldops-alert-engine
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${ALERT_ENGINE_PORT:-4006}
      ALERT_CHECK_INTERVAL_MS: ${ALERT_CHECK_INTERVAL_MS:-60000}
      ALERT_ESCALATION_TIMEOUT_MINUTES: ${ALERT_ESCALATION_TIMEOUT_MINUTES:-30}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME}
      WHATSAPP_OWNER_JID: ${WHATSAPP_OWNER_JID}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
    ports:
      - '4006:4006'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Creator Module ───────────────────────────────────────────
  creator-module:
    build:
      context: .
      dockerfile: services/creator-module/Dockerfile
    container_name: fieldops-creator-module
    <<: *service-defaults
    environment:
      <<: *common-env
      PORT: ${CREATOR_MODULE_PORT:-4007}
      TIKTOK_API_KEY: ${TIKTOK_API_KEY:-}
      INSTAGRAM_API_KEY: ${INSTAGRAM_API_KEY:-}
      CREATOR_COMMISSION_CALCULATION_DAY: ${CREATOR_COMMISSION_CALCULATION_DAY:-28}
      ALERT_ENGINE_INTERNAL_URL: ${ALERT_ENGINE_INTERNAL_URL}
      EVIDENCE_VAULT_INTERNAL_URL: ${EVIDENCE_VAULT_INTERNAL_URL}
    ports:
      - '4007:4007'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Dashboard (Next.js) ──────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: fieldops-dashboard
    <<: *service-defaults
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
    ports:
      - '3000:3000'
    depends_on:
      - api

networks:
  fieldops-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  evidence_data:
    driver: local
  content_uploads:
    driver: local
